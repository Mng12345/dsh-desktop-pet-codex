[package]
name = "dsh-desktop-pet"
version = "0.1.0"
edition = "2021"
description = "A transparent always-on-top pet window that shows Harness session status."
license = "MIT"
publish = false

[lib]
name = "dsh_desktop_pet_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
# A pet window is a long-lived background process; favour size and steady-state
# memory over compile-time optimizations.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
