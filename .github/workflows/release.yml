# Build the release tarball that the plugin market installs.
#
# The market prefers, in order: a registry package, a prebuilt GitHub Release
# archive, and only then the repository source. This workflow produces both of
# the first two — it publishes the plugin to npm with the window binary for
# every platform inside the tarball, and attaches the same tree to the GitHub
# Release as a `.tgz` for anyone pinning a version. Building the window needs
# Rust and several minutes, and the market deliberately refuses to run install
# scripts, so the binaries are staged into `plugin/bin/<platform>-<arch>/`
# before either artifact is produced.
#
# One archive serves Windows, macOS and Linux: the plugin picks the binary that
# matches the machine it runs on, so a single download is complete everywhere.
# Each target is built close to natively — Windows and Linux on their own runners
# because a Tauri window needs the platform's system web view, macOS arm64 on an
# arm64 runner — and the four binaries are packed together in the second job.
# Intel macOS is the one exception: its macos-13 job never left the queue (no runner
# was ever assigned), so it is cross-compiled from the arm64 runner against Apple's
# dual-architecture SDK instead.
#
# The binaries are build products, so they are not in git (see .gitignore); they
# are attached to the release instead. The artwork *is* in git, so a checkout can
# build a window that draws her with nothing supplied.
name: release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  # Trusted publishing: the publish step exchanges this job's OIDC token for a
  # short-lived npm credential, so the repository stores no npm token.
  id-token: write

jobs:
  build:
    strategy:
      # One target failing must not cancel the others: the log of the failure is
      # the whole point of running them together.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: win32-x64
            binary: dsh-desktop-pet.exe
            dir: target/release
          - os: ubuntu-latest
            target: linux-x64
            binary: dsh-desktop-pet
            dir: target/release
          - os: macos-latest
            target: darwin-arm64
            binary: dsh-desktop-pet
            dir: target/release
          # Intel macOS is cross-compiled from the arm64 runner: the macos-13 job
          # sat in the queue with no runner assigned for over ten minutes while
          # every other label started, and Apple's SDKs carry both architectures,
          # so one runner can build both defaults.
          - os: macos-latest
            target: darwin-x64
            binary: dsh-desktop-pet
            dir: target/x86_64-apple-darwin/release
            rust_target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # rustup reads rust-toolchain.toml from the repository root and installs
      # the pinned channel on first use, so the machine's own stable channel
      # never matters. Cargo must therefore be invoked with a working directory
      # inside the repository — the build steps below do that.
      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: pet-app/src-tauri

      # A Tauri window draws with the system WebKitGTK on Linux, and that is a
      # package manager concern rather than something cargo can fetch.
      - name: Install the Linux window libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf

      # The frames are committed, so this is a guard against a bad checkout
      # rather than a fetch. Packing without them would ship a window that draws
      # nothing, and tools/pack-release.mjs checks the same thing again.
      - name: Check the artwork is present
        shell: bash
        run: |
          count=$(find pet-app/public/frames -name '*.png' | wc -l)
          echo "pose frames in the checkout: $count"
          if [ "$count" -lt 34 ]; then
            echo "::error::expected 34 committed pose frames under pet-app/public/frames, found $count. They are part of the repository — check that .gitignore has not grown a rule that excludes them."
            exit 1
          fi

      - name: Install plugin dependencies
        working-directory: plugin
        run: npm ci

      - name: Install window dependencies
        working-directory: pet-app
        run: npm ci

      # Rust records the source path of every panic location in the binary, so a
      # build made on a developer machine names that machine's home directory.
      # Remapping the two prefixes that carry it keeps the published executable
      # free of them; tools/pack-release.mjs independently refuses to pack a
      # binary that still names someone's home directory or checkout.
      - name: Build the window (Windows)
        if: runner.os == 'Windows'
        working-directory: pet-app
        shell: pwsh
        run: |
          $env:RUSTFLAGS = "--remap-path-prefix=$env:USERPROFILE=~ --remap-path-prefix=$env:GITHUB_WORKSPACE=~"
          npm run build

      - name: Build the window (macOS and Linux)
        if: runner.os != 'Windows'
        working-directory: pet-app
        run: |
          export RUSTFLAGS="--remap-path-prefix=$HOME=~ --remap-path-prefix=$GITHUB_WORKSPACE=~"
          if [ -n "${{ matrix.rust_target }}" ]; then
            # Cross-compiling for Intel macOS: the runner is arm64, so the
            # target has to be installed before cargo knows how to name it.
            rustup target add "${{ matrix.rust_target }}"
            npm run build:icon
            npm run build:ui
            cargo build --release --manifest-path src-tauri/Cargo.toml --target "${{ matrix.rust_target }}"
          else
            npm run build
          fi

      # The directory name is the contract with the plugin: it resolves
      # bin/<platform>-<arch>/dsh-desktop-pet[.exe] at launch time.
      - name: Stage the binary where the plugin looks for it
        shell: bash
        run: |
          mkdir -p "plugin/bin/${{ matrix.target }}"
          cp "pet-app/src-tauri/${{ matrix.dir }}/${{ matrix.binary }}" "plugin/bin/${{ matrix.target }}/${{ matrix.binary }}"
          chmod +x "plugin/bin/${{ matrix.target }}/${{ matrix.binary }}" 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.target }}
          path: plugin/bin/${{ matrix.target }}/${{ matrix.binary }}
          if-no-files-found: error

  pack:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # One artifact per target; each lands in the directory the plugin expects,
      # so the packer sees the same tree a full build would have produced.
      - uses: actions/download-artifact@v4
        with:
          name: bin-win32-x64
          path: plugin/bin/win32-x64
      - uses: actions/download-artifact@v4
        with:
          name: bin-linux-x64
          path: plugin/bin/linux-x64
      - uses: actions/download-artifact@v4
        with:
          name: bin-darwin-arm64
          path: plugin/bin/darwin-arm64
      - uses: actions/download-artifact@v4
        with:
          name: bin-darwin-x64
          path: plugin/bin/darwin-x64

      # `prepare` runs the TypeScript build, so lib/ exists without a separate
      # build step; this job never invokes cargo.
      - name: Install plugin dependencies
        working-directory: plugin
        run: npm ci

      # --require-all turns a missing platform into a failed release instead of
      # an archive that installs without a window somewhere. It also re-checks
      # that every binary carries no developer paths.
      - name: Pack all four platforms into one tarball
        run: node tools/pack-release.mjs --skip-build --require-all --out release

      # npm names the tarball after the manifest version (`-<version>.tgz`) while a
      # tag carries the `v` prefix. Rename it once so the asset name and the
      # install URL in the release body are the same string, then keep a copy
      # under a fixed name: /releases/latest/download/<fixed name> always
      # resolves to the newest release, so the README can print one URL that
      # never goes stale.
      - name: Name the asset, and add a version-independent copy
        shell: bash
        run: |
          set -euo pipefail
          versioned="dsh-desktop-pet-codex-${GITHUB_REF_NAME}.tgz"
          mv release/*.tgz "release/$versioned"
          cp "release/$versioned" release/dsh-desktop-pet-codex.tgz
          ls -l release

      # The tag and plugin/package.json must agree before anything leaves the
      # runner: npm keeps a version forever, so a typo here is not re-publishable.
      - name: Check the tag names this package version
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: plugin
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "tag ${GITHUB_REF_NAME} names version ${tag}, but plugin/package.json is ${version}" >&2
            exit 1
          fi
          echo "releasing dsh-desktop-pet-codex@${version}"

      # Trusted publishing is newer than the npm the runner image ships with.
      # The npm docs use exactly this step, so it runs as the runner user.
      - name: Upgrade npm for trusted publishing
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          npm install --global npm@latest
          npm --version

      # Trusted publishing exchanges the job's OIDC token for a short-lived
      # credential, so no npm token lives in the repository. The existence check
      # makes a re-run of an already published tag a no-op instead of a failure.
      - name: Publish to npm
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: plugin
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          if npm view "dsh-desktop-pet-codex@${version}" version >/dev/null 2>&1; then
            echo "dsh-desktop-pet-codex@${version} is already on npm; skipping publish."
            exit 0
          fi
          npm publish --provenance --access public

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-pet-codex-tarball
          path: release/*.tgz
          if-no-files-found: error

      - name: Attach it to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.tgz
          fail_on_unmatched_files: true
          body: |
            Install from npm (the tarball already carries the window binary for
            every platform, so nothing is built or downloaded during install):

            ```
            plugin_manager  action: install_bundle  target: dsh-desktop-pet-codex
            ```

            The Web sidebar's Plugins → Add plugin takes the same package name.
            Or point the plugin manager at the release archive below, which holds
            the same files for anyone pinning a version:

            ```
            plugin_manager  action: install_bundle
                            target: ${{ github.server_url }}/${{ github.repository }}/releases/latest/download/dsh-desktop-pet-codex.tgz
            ```

            That URL always resolves to the newest release. The asset named after
            this tag is the same archive, for anyone pinning a version.

            Linux needs WebKitGTK 4.1 at runtime (`libwebkit2gtk-4.1-0`), which Tauri draws
            with — Debian 12+, Ubuntu 24.04+ and Fedora 39+ ship it. The macOS binary is
            unsigned — see the README if Gatekeeper objects.
